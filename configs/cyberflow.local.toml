# =====================================================================
#  CyberFlow - configuracion unica del despliegue
# ---------------------------------------------------------------------
#  Todo lo que cambia entre una instalacion y otra vive AQUI. Las unidades
#  de systemd se generan desde este fichero con:
#
#      python3 scripts/setup/cyberflow_config.py --mostrar
#      sudo python3 scripts/setup/cyberflow_config.py --escribir
#
#  Antes existia cableado dentro de los .service: la interfaz ens35, un
#  filtro BPF con las redes 10.20.0.0/24 y 10.30.0.0/24 del laboratorio, el
#  usuario useransible y rutas absolutas a /home/useransible. Nada de eso
#  sobrevivio al primer despliegue en una red distinta.
# =====================================================================

[captura]
# Interfaz que recibe el espejo. NO debe tener direccion IP.
# Identificala por MAC, no por nombre: Linux renumera al anadir adaptadores.
interfaz = "ens37"
mac_esperada = "00:0c:29:15:7c:02"

# Buffer en anillo: archivos x segundos = historia disponible.
# 16 x 15 s = 240 s. --historia_segundos del motor debe ser algo menor.
anillo_archivos = 16
anillo_segundos = 15
directorio = "/var/lib/ppi-motor-capture"

# Cuanto se conserva en disco. tcpdump -G rota por tiempo, pero con un nombre
# con fecha no reutiliza nombres: -W no borra nada y el anillo crece sin fin
# (medido: 403 MB en un dia). Un temporizador poda lo mas viejo cada 5 min.
# Tiene que ser mayor que la duracion del anillo o se borraria historia en uso.
retener_minutos = 15

# Filtro BPF. Vacio = capturar todo.
# CUIDADO: sobre tramas etiquetadas 802.1Q un filtro "ip" normal NO casa;
# hay que escribirlo como "vlan and ip" o el anillo sale vacio en silencio.
filtro_bpf = ""

[red]
# Rango del que se extraen las entidades a puntuar.
red_entidades = "10.10.0.0/16"

# Protocolos que no son trafico de usuarios y no se atribuyen a nadie.
#   112 = VRRP/CARP. Cada interfaz VLAN del cortafuegos emite un anuncio por
#         segundo; sin esto, cada una aparece como una entidad con actividad
#         constante y el modelo la puntua. Medido: 14 de 23 entidades eran eso.
#   240 = pfsync, la sincronizacion entre los dos cortafuegos.
# Declarar esta exclusion en la tesis: es una decision de alcance, no un ajuste.
excluir_protocolos = [112, 240]

# Trafico de gestion del propio despliegue. Se captura igual -para poder
# medir cuanto se excluyo- pero no se puntua.
excluir = [
    "10.10.60.11/32",   # el propio sensor: su SSH cruza el troncal espejado
    "10.10.10.30/32",   # el bastion, el otro extremo de esa sesion
    # 24-oct-2026: equipos del perfil de egreso y los dos pfSense. Se capturan
    # pero no se puntuan ni entran al dataset (misma lista en motor y acumulador).
    "10.10.60.2/32",   # pfSense-A: el router no es un usuario; ademas nunca debe recibir LIMIT/BLOCK
    "10.10.60.3/32",   # pfSense-B: idem (112 ALERT y un LIMIT en 48 h antes de excluirlo)
    "10.10.60.10/32",   # Wazuh: infraestructura del perfil de egreso, fuera del diseno experimental
    "10.10.60.20/32",   # AAA-01 (perfil de egreso)
    "10.10.60.21/32",   # AAA-02 (perfil de egreso)
    "10.10.60.30/32",   # VM-NETOPS (perfil de egreso, futura)
    "10.10.60.40/32",   # NetBox (perfil de egreso)
    "10.10.60.41/32",   # GLPI (perfil de egreso)
    "10.10.60.50/32",   # IdP (perfil de egreso)
]

[motor]
detector = "if_limpio_2026_10"
# "observacion" = puntua y registra, no toca nftables.
# "bloqueo"     = anade --enforce. Solo tiene sentido si el sensor esta EN EL
#                 CAMINO del trafico. Con un espejo SPAN no lo esta.
modo = "observacion"

paso_segundos = 10
historia_segundos = 230
umbral = 1.8126087939765134

# false = el umbral viene de otra red. El panel lo advierte y pide tratar las
# alertas como ruido. Ponlo en true SOLO despues de recalibrar con trafico
# propio: es lo que separa una demostracion de una medicion.
calibrado_en_esta_red = true
bloqueo_segundos = 120

[rutas]
# Interprete con el que se crea el entorno virtual. Vacio = el instalador
# busca uno que coincida con la version del manifiesto del modelo y, si no lo
# encuentra, usa el python3 del sistema avisando.
# No es un capricho: en scikit-learn 1.7.2 -la version mas alta disponible
# para Python 3.12- IsolationForest acepta sample_weight y lo ignora en
# silencio. Ver docs/INSTALACION.md, anexo B.
python = ""

usuario = "m4rk"
raiz = "/home/m4rk/cyberflow"
entorno = ".venv"
eve = "/var/log/suricata/eve.json"
modelo = "artifacts/preliminar/limpio-2026-10/if_limpio_2026_10_desplegable.joblib"
manifiesto = "artifacts/preliminar/limpio-2026-10/manifest-if-limpio-2026-10.json"
esquema = "configs/features/multilayer-v2.json"
registro = "logs/motor_decision.log"

[panel]
# Solo escucha en loopback y es de solo lectura. Para verlo desde otra
# maquina: ssh -L 8788:127.0.0.1:8788 usuario@sensor
activo = true
# "127.0.0.1": solo en local; se ve con un tunel SSH (ver-panel.ps1).
# Otra direccion: expuesto en la red. El panel NO tiene autenticacion, asi que
# entonces es obligatorio "permitir": el generador crea una regla nftables que
# solo deja pasar a esos origenes, y el panel no arranca si la regla falla.
direccion = "10.10.60.11"
puerto = 8788
# Si llega por Tailscale a traves de un enrutador de subred, el sensor ve la
# IP de ESE enrutador, no la del portatil: Tailscale traduce el origen.
permitir = ["10.10.10.30/32"]

[reentrenamiento]
# Reentrenamiento SUPERVISADO (docs/APRENDIZAJE.md). Prepara y evalua candidatos
# cada noche; el modelo en uso solo cambia con "promover", a mano.
activo = true
# Particion de la nota L, reconstruida el 2026-10-11 y verificada: mismo sha256
# (bdf6f641...) que anoto ensayo-if-v2.json, el paquete del modelo desplegado.
base = "artifacts/aprendizaje/base/particionado-nota-L.csv"
# Sin ventanas de ataque etiquetadas en esta red todavia: el veredicto quedara en
# EVALUACION_INCOMPLETA hasta que se anadan (p. ej. las de la Kali, nota M).
ataques = "artifacts/aprendizaje/ataques/ataques-nota-M.csv"
excluir_ventanas = ["10.10.20.30@2026-10-15T10:00:00+00:00/2026-10-16T02:00:00+00:00", "10.10.20.30@2026-10-15T02:55:00+00:00/2026-10-15T05:30:00+00:00", "10.10.20.30@2026-09-27T21:35:00+00:00/2026-09-27T22:05:00+00:00", "10.10.20.30@2026-10-12T12:46:00+00:00/2026-10-12T12:49:00+00:00", "10.10.20.30@2026-10-13T22:18:00+00:00/2026-10-13T22:40:00+00:00", "10.10.20.30@2026-10-13T22:55:00+00:00/2026-10-13T23:30:00+00:00"]  # rafaga de la Kali dentro de la linea base (nota S)
