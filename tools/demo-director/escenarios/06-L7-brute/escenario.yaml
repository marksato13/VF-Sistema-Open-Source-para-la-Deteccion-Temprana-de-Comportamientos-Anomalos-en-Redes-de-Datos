titulo: L7 · Fuerza bruta HTTP
capa: L7 · Aplicación
tipo: ataque
ip: 10.10.20.30
origen: kali
tarjeta_panel: Fuerza bruta HTTP
panel_id: brute
pasos:
- tipo: decir
  texto: 'Capa de aplicación: una ráfaga de logins fallidos contra un endpoint que exige autenticación (responde 401). La huella de un ataque de credenciales.'
  gui: '#s-escenario · tarjeta «Fuerza bruta HTTP»'
- tipo: ejecutar
  panel: sensor
  comando: ~/cf-demo/mira-motor.sh {ip}
  explica: 'SENSOR1: el motor en vivo para 10.10.20.30, una línea por ventana de 10 s.'
  procedimiento: 'Lee la cola de ~/cyberflow/logs/motor_decision.log (solo lectura) y muestra por ventana: hora,
    score frente al umbral, decisión y, si salta, la regla con su motivo.'
  gui: '#s-escenario · «Ventanas de la IP»'
- tipo: ejecutar
  panel: srvdmz
  comando: ~/cf-demo/mira-agente.sh {ip}
  explica: 'SRV-DMZ: el servidor protegido por dentro: agente activo, orden recibida y su firewall.'
  procedimiento: 'Cada 2 s: temporizador ppi-enforce-agent, feed firmado recibido, orden para la IP, liberación
    humana y los sets de nftables `inet cyberflow_dmz` (solo lectura).'
  gui: '#s-escenario · paso 5 «Host»'
- tipo: ejecutar
  panel: origen
  comando: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 -u x:x http://10.10.30.10:8081/
  espera: HTTP 401
  explica: 'ANTES: una petición al endpoint. Debe responder «HTTP 401»: exige autenticación y el servidor contesta.'
  procedimiento: '`-u x:x` manda credenciales inválidas; `-w %{http_code}` imprime solo el estado; `--max-time 5`
    se rinde en 5 s. 401 = el servidor contesta y rechaza la credencial; 000 = no llegó (bloqueado o caído).'
  gui: '— solo CLI: la prueba la hace el origen'
- tipo: panel
  ruta: '#s-escenario · tarjeta «Fuerza bruta HTTP» → Iniciar seguimiento de 10.10.20.30'
  explica: 'En el panel: Iniciar. Aparece la barra guiada abajo con los 5 pasos.'
  gui: '#s-escenario + barra guiada (paso 1 Ataque)'
  captura: inicio
- tipo: ataque
  panel: origen
  comando: for i in $(seq 1 120); do curl -s -o /dev/null -u x:x http://10.10.30.10:8081/; done
  explica: 120 intentos de login, todos fallidos (401). El sensor ve una copia del tráfico (espejo).
  procedimiento: 'Cada vuelta manda una credencial inválida al endpoint 8081; 120 en pocos segundos. La señal que
    mide CyberFlow es http_auth_failure_ratio_60s = HTTP con 401/403 ÷ total HTTP en 60 s.'
  gui: barra guiada · 1 Ataque (reloj en marcha)
- tipo: esperar
  hito: deteccion
  max: 180
  explica: 'Regla brute_force (≥5 req HTTP/60s y ≥80 % de fallo de auth): BLOCK. El modelo mide flojo justo este patrón.'
  gui: barra guiada · 2 Actividad
- tipo: panel
  ruta: '#s-actividad · fila de 10.10.20.30 (resaltada) → clic'
  explica: 'ACTIVIDAD: la IP sube entre las entidades con su acción. Clic en ella.'
  gui: '#s-actividad · tabla de entidades'
  captura: actividad
- tipo: panel
  ruta: '#s-decisiones · filtrada por 10.10.20.30'
  explica: 'DECISIONES: ventana por ventana, quién lo detecta (regla brute_force) y por qué. El modelo va como señal.'
  gui: '#s-decisiones (filtro = la IP)'
  captura: decisiones
- tipo: esperar
  hito: publicacion
  max: 60
  explica: El sensor publica la orden BLOCK en el feed firmado, con caducidad. No toca el servidor.
  gui: barra guiada · 4 Respuestas
- tipo: panel
  ruta: '#s-bloqueos · fila de 10.10.20.30'
  explica: 'RESPUESTAS: la orden publicada, su detector (brute_force) y cuándo caduca.'
  gui: '#s-bloqueos'
  captura: respuestas
- tipo: esperar
  hito: aplicacion
  max: 60
  explica: El agente de srv-dmz trae el feed, verifica la firma y pone la IP en nftables.
  gui: barra guiada · 5 Host (acuse de srv-dmz)
  captura: aplicacion
- tipo: ejecutar
  panel: srvdmz
  si: aplicada
  comando: ~/cf-demo/en-firewall.sh {ip}
  espera: ''
  explica: 'HOST (CLI): la IP está en el set de nftables del servidor (BLOCK).'
  procedimiento: Consulta los sets `bloqueados` y `limitados` de la tabla `inet cyberflow_dmz` (solo lectura). Imprime
    BLOCK, LIMIT o NO.
  gui: barra guiada · 5 Host
- tipo: ejecutar
  panel: origen
  si: aplicada
  comando: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 -u x:x http://10.10.30.10:8081/
  espera: ''
  explica: 'CON la regla: la petición ya no llega: «HTTP 000» (se rinde a los 5 s). El servidor dejó de contestarle.'
  procedimiento: 'La misma sonda de antes. 000 = la IP está bloqueada en el firewall del servidor; ni el login llega.'
  gui: — solo CLI
- tipo: ejecutar
  panel: srvdmz
  si: aplicada
  comando: ~/cf-demo/desbloquear.sh {ip}
  espera: tras liberar
  explica: 'Revisión humana: un comando en el servidor libera la IP.'
  procedimiento: 'Llama al agente con `--liberar IP`: quita la IP de los dos sets y anota la liberación (por detector)
    con 120 s de gracia para la cola del mismo episodio. Una orden nueva sí se aplica.'
  gui: '#s-escenario · paso 5 «liberada por revisión humana»'
  captura: liberacion
- tipo: ejecutar
  panel: origen
  si: aplicada
  comando: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 -u x:x http://10.10.30.10:8081/
  espera: HTTP 401
  explica: 'DESPUÉS de liberar: vuelve a «HTTP 401». El servidor le contesta otra vez.'
  procedimiento: 'La misma sonda. Tras la liberación la IP sale del set y el endpoint vuelve a responder 401.'
  gui: — solo CLI
- tipo: comparar
  explica: El mismo tráfico frente a Suricata 7 + ET Open. Suricata alerta por los 401; CyberFlow decide y responde.
  procedimiento: 'comparar-suricata.sh: (1) recorta del anillo PCAP del sensor la IP y el intervalo del ataque;
    (2) lo copia a la VM 10.10.60.13; (3) `suricata -r` con todas las firmas; (4) cuenta las ventanas de CyberFlow
    del mismo intervalo y el acuse del host. Deja fast.log en la VM y el resumen en sensor1:~/feed/comparaciones/.'
  gui: '#s-comparacion · tarjeta de esta comparación'
  captura: suricata
- tipo: decir
  texto: 'El modelo mide flojo la fuerza bruta; quien la caza es el heurístico brute_force. El híbrido tapa el hueco. BLOCK con caducidad; corta el host, no el sensor.'
  gui: barra guiada · 5/5 en verde
