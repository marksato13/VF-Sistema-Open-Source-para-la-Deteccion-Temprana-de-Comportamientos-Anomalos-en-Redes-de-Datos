---
- name: Desplegar lectura restringida de métricas en VM02 Sensor
  hosts: ppi-sensor
  become: true
  gather_facts: false

  tasks:
    - name: Instalar límite persistente del búfer PCAP
      ansible.builtin.copy:
        src: ../../configs/sensor/99-ppi-pcap-buffer.conf
        dest: /etc/sysctl.d/99-ppi-pcap-buffer.conf
        owner: root
        group: root
        mode: "0644"
      register: ppi_pcap_sysctl

    - name: Aplicar sysctl del búfer PCAP
      ansible.builtin.command: /usr/sbin/sysctl -p /etc/sysctl.d/99-ppi-pcap-buffer.conf
      when: ppi_pcap_sysctl.changed
      changed_when: true

    - name: Leer límite efectivo del búfer PCAP
      ansible.builtin.command: /usr/sbin/sysctl -n net.core.rmem_max
      register: ppi_pcap_rmem_max
      changed_when: false

    - name: Exigir el límite de búfer versionado
      ansible.builtin.assert:
        that:
          - ppi_pcap_rmem_max.stdout == "67108864"
        fail_msg: net.core.rmem_max no coincide con la configuración de captura

    - name: Instalar recolector inmutable para useransible
      ansible.builtin.copy:
        src: ../../configs/sensor/ppi-suricata-metrics
        dest: /usr/local/sbin/ppi-suricata-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Instalar controlador de PCAP con interfaz y filtro fijos
      ansible.builtin.copy:
        src: ../../configs/sensor/ppi-pcap-control
        dest: /usr/local/sbin/ppi-pcap-control
        owner: root
        group: root
        mode: "0755"

    - name: Autorizar solamente los controladores del orquestador
      ansible.builtin.copy:
        src: ../../configs/sensor/useransible-ppi-metrics.sudoers
        dest: /etc/sudoers.d/useransible-ppi-metrics
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: Desplegar generador benigno limitado en VM05 Cliente
  hosts: ppi-client
  become: false
  gather_facts: false

  tasks:
    - name: Crear directorio de herramientas de campaña
      ansible.builtin.file:
        path: /home/useransible/bin
        state: directory
        owner: useransible
        group: useransible
        mode: "0750"

    - name: Instalar generador F1 con límites calibrados
      ansible.builtin.copy:
        src: ../../scripts/f1/run-benign.sh
        dest: /home/useransible/bin/ppi-run-benign
        owner: useransible
        group: useransible
        mode: "0750"
