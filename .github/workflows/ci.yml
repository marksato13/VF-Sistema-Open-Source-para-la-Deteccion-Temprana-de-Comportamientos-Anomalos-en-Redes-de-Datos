# =====================================================================
#  CI de CyberFlow
# ---------------------------------------------------------------------
#  Cada comprobacion corresponde a algo que ya se rompio una vez sin que
#  nadie se enterara hasta verificarlo a mano:
#
#    integridad      dos hashes publicados dejaron de cuadrar por CRLF
#    tests           nadie los habia ejecutado tras la reorganizacion
#    configuracion   las unidades venian cableadas a otro laboratorio
#    guiones         un instalador con CRLF no arranca ("pipefail\r")
#    reproduccion    bajo otra version de scikit-learn el modelo principal
#                    cambio de resultado sin dar ningun error
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integridad:
    name: Integridad de los artefactos publicados
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: sha256sum -c docs/dataset/SHA256SUMS
        run: sha256sum -c docs/dataset/SHA256SUMS
      - name: Ningun fichero de texto con CRLF
        run: |
          # columna 1 = el indice, que es lo que se publica. Los ficheros
          # marcados -text quedan fuera: los CSV publicados son CRLF de
          # origen y su hash depende de esos bytes.
          malos=$(git ls-files --eol | awk '$1 ~ /crlf/ && $3 !~ /-text/ {print $NF}')
          if [ -n "$malos" ]; then
            echo "Ficheros con CRLF en el repositorio:"; echo "$malos"; exit 1
          fi

  tests:
    name: Tests (CPython del manifiesto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Leer la version de Python que exige el manifiesto
        id: py
        run: echo "version=$(python3 -c "import json;print(json.load(open('artifacts/model/manifest.json'))['runtime']['python'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: python -m pip install -r requirements-model.txt
      - run: python -m unittest discover -s tests -v

  configuracion:
    name: Configuracion y unidades
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El ejemplo publicado es valido
        run: python scripts/setup/cyberflow_config.py --comprobar
      - name: Las unidades se generan
        run: python scripts/setup/cyberflow_config.py --mostrar

  guiones:
    name: Guiones de instalacion
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis
        run: for f in scripts/setup/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: shellcheck (errores)
        run: shellcheck --severity=error scripts/setup/*.sh

  unidades:
    name: Las unidades generadas son validas para systemd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar las unidades a un directorio temporal
        # Se importa el generador y se usa render() directamente, en vez de
        # trocear la salida de --mostrar: ese formato es para leerlo una
        # persona y cambiarlo no deberia romper el CI.
        run: |
          mkdir -p "$RUNNER_TEMP/unidades"
          python - "$RUNNER_TEMP/unidades" <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "cc", "scripts/setup/cyberflow_config.py")
          cc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cc)
          destino = pathlib.Path(sys.argv[1])
          unidades = cc.render(cc.cargar(pathlib.Path("configs/cyberflow.toml")))
          n = 0
          for nombre, cuerpo in unidades.items():
              if nombre.endswith((".service", ".timer", ".socket")):
                  (destino / nombre).write_text(cuerpo, encoding="utf-8")
                  n += 1
          print(f"{n} unidades escritas")
          assert n >= 5, f"se esperaban al menos 5 unidades, se generaron {n}"
          PY
      - name: systemd-analyze verify
        # Detecta directivas mal escritas, secciones invalidas y valores que
        # systemd no sabe interpretar. Un .service con una errata arranca
        # "bien" hasta que hace falta: este trabajo existe porque eso ya paso
        # una vez (226/NAMESPACE por un ReadWritePaths a un directorio que no
        # existia).
        #
        # Se BUSCAN los errores en vez de filtrar el ruido. En el runner no
        # existen el usuario del despliegue, ni sus rutas, ni suricata.service,
        # asi que systemd-analyze se queja de todo eso con razon y no es lo que
        # se valida aqui: lo que se valida es la SINTAXIS de lo que genera el
        # generador. Enumerar el ruido seria una lista que se queda corta a la
        # primera version distinta de systemd.
        run: |
          salida=$(systemd-analyze verify "$RUNNER_TEMP"/unidades/*.service "$RUNNER_TEMP"/unidades/*.timer 2>&1 || true)
          echo "--- salida completa de systemd-analyze ---"
          echo "$salida"
          echo "--- fin ---"
          graves=$(echo "$salida" | grep -E -e "Unknown lvalue" \
                                            -e "Unknown section" \
                                            -e "Failed to parse" \
                                            -e "Invalid (unit|section|setting|value)" \
                                            -e "is not absolute" \
                                            -e "Missing '='" || true)
          if [ -n "$graves" ]; then
            echo "systemd rechaza la SINTAXIS de alguna unidad generada:"
            echo "$graves"
            exit 1
          fi
          echo "Ninguna unidad tiene errores de sintaxis."

  reproduccion:
    name: El modelo publicado se reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [integridad, tests]
    steps:
      - uses: actions/checkout@v4
      - id: py
        run: echo "version=$(python3 -c "import json;print(json.load(open('artifacts/model/manifest.json'))['runtime']['python'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: python -m pip install -r requirements-model.txt
      - name: BLAS y CPU de este runner
        # El bit a bit depende del kernel de OpenBLAS, que elige segun la CPU.
        # El verificador lo compara con el que registra el manifiesto.
        run: |
          python -c "import threadpoolctl, json; print(json.dumps([{k: t.get(k) for k in ('internal_api','version','architecture','num_threads')} for t in threadpoolctl.threadpool_info()], indent=1))"
          grep -m1 "model name" /proc/cpuinfo; nproc
      - name: Recalibrar con el protocolo publicado
        run: |
          python scripts/modeling/calibrate_multilayer_v2_v1.py --execute-once \
            --protocol PM-multilayer-v2-v1 \
            --expected-git-commit "$(git rev-parse HEAD)" \
            --artifacts-root "$GITHUB_WORKSPACE/artifacts" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/model-ci" > "$RUNNER_TEMP/calibracion.json"
          # fuera del repositorio: el script exige el arbol limpio antes y
          # despues, y una redireccion aqui crearia el fichero antes de empezar
      - name: Comparar con el manifiesto publicado
        run: |
          python scripts/analysis/verificar_reproduccion.py \
            artifacts/model/manifest.json artifacts/model-ci/manifest.json
