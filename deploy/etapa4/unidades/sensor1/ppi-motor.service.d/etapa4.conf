# /etc/systemd/system/ppi-motor.service.d/etapa4.conf  (0644 root:root) — Etapa 4, SOMBRA.
# Sustituye SOLO el ExecStart de la unidad generada por cyberflow_config.py; el fichero base no se
# edita. Retirar este drop-in (y daemon-reload + restart) devuelve exactamente el motor anterior.
#
# Cambios frente a lo desplegado (24f8a80 en ~/cyberflow, observado el 2026-11-02):
#   - código: copia de solo lectura de ec78ca5 en /home/m4rk/cyberflow-e4/ec78ca5 (no es un checkout);
#     motor_decision.py importa sus módulos de su propio directorio y extractor de ../features;
#   - --disparo eventos (validado en Etapa 2 R1–R4 y en los replays de la Etapa 3 con anillo de 5 s);
#   - --state-dir propio (_state-e4): el estado de 24f8a80 queda intacto para la reversión;
#   - mismos modelo, manifiesto (umbral), esquema, red, exclusiones, log, paso y horizonte.
# Sin --enforce: el motor no ejecuta ninguna orden de bloqueo.
[Service]
ExecStart=
ExecStart=/home/m4rk/cyberflow/.venv/bin/python \
    /home/m4rk/cyberflow-e4/ec78ca5/scripts/engine/motor_decision.py \
    --eve-path /var/log/suricata/eve.json \
    --capture-dir /var/lib/ppi-motor-capture \
    --model-path /home/m4rk/cyberflow/artifacts/preliminar/limpio-2026-10/if_limpio_2026_10_desplegable.joblib \
    --manifest-path /home/m4rk/cyberflow/artifacts/preliminar/limpio-2026-10/manifest-if-limpio-2026-10.json \
    --detector-name if_limpio_2026_10 \
    --schema /home/m4rk/cyberflow/configs/features/multilayer-v2.json \
    --entity-network 10.10.0.0/16 \
    --excluir 10.10.60.11/32,10.10.10.30/32,10.10.60.2/32,10.10.60.3/32,10.10.60.10/32,10.10.60.20/32,10.10.60.21/32,10.10.60.30/32,10.10.60.40/32,10.10.60.41/32,10.10.60.50/32 \
    --excluir-protocolos 112,240 \
    --log-path /home/m4rk/cyberflow/logs/motor_decision.log \
    --state-dir /home/m4rk/cyberflow/logs/_state-e4 \
    --step-seconds 10 \
    --history-seconds 230 \
    --disparo eventos
