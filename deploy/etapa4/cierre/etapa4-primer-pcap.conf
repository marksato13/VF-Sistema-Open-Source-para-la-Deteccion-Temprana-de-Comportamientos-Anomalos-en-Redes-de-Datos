# /etc/systemd/system/ppi-motor-capture.service.d/etapa4-primer-pcap.conf  (0644 root:root)
# Cierre complementario de la 4A (4-nov-2026). Único cambio: tras arrancar tcpdump, devolver al
# grupo del directorio (m4rk) el primer fichero de ese arranque, que tcpdump deja tcpdump:tcpdump
# (ver /usr/local/sbin/cf-primer-pcap). No cambia ExecStart, ni -Z, ni UMask, ni el usuario.
# El «-» hace que un fallo del ajuste no pare la captura: se ve en el journal y en pcaps_ilegibles.
# Retirar: borrar este fichero, daemon-reload y restart (vuelve el comportamiento anterior).
[Service]
ExecStartPost=-/usr/local/sbin/cf-primer-pcap /var/lib/ppi-motor-capture m4rk
