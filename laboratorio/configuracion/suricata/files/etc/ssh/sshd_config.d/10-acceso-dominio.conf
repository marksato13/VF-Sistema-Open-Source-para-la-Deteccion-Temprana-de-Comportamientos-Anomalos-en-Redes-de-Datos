# Ansible managed
# =============================================================================
#  Quien puede abrir una sesion SSH en suricata
# =============================================================================
#
#  AllowGroups se evalua ANTES de pedir la contrasena. Esa es la diferencia con
#  require_membership_of de pam_winbind, que se evalua despues de validarla:
#  aqui una cuenta no autorizada ni siquiera llega a intentar autenticarse, y el
#  rechazo queda anotado con el nombre del grupo que falto.
#
#  Los dos controles se solapan a proposito. Si manana alguien retira este
#  fichero, pam_winbind sigue cerrando la puerta; si alguien vacia el filtro de
#  PAM, sshd sigue cerrandola.
#
#  EL PRIMER NOMBRE DE LA LISTA ES EL QUE IMPIDE PERDER LA MAQUINA.
#    sudo -> grupo local, contiene la cuenta de emergencia y la de Ansible.
#  Si desapareciera de aqui, un corte del directorio dejaria la maquina sin
#  ninguna via de entrada: el resto de los grupos solo existen en AD.
# =============================================================================

AllowGroups sudo rol-srv-admin rol-sec-admin rol-auditoria
