# /etc/systemd/system/ppi-publicar-feed-v2.service.d/zz-lista-blanca.conf  (16-nov-2026)
# Igual que zz-d5-sin-reinicio.conf, pero con el publicador derivado (_lb) y --lista-blanca.
# Rollback: borrar este fichero, daemon-reload y restart (vuelve a zz-d5-sin-reinicio.conf).
[Service]
ExecStart=
ExecStart=/home/m4rk/cyberflow/.venv/bin/python /home/m4rk/cf-b/d5/publicar_feed_v2_d5_lb.py --log /home/m4rk/cyberflow/logs/motor_decision.log --estado /home/m4rk/feed-v2/estado.json --clave-privada /home/m4rk/cyberflow/artifacts/feed-keys/priv.pem --salida-feed /home/m4rk/feed-v2/feed.json --salida-firma /home/m4rk/feed-v2/feed.sig --senales /home/m4rk/feed-v2/senales-if.jsonl --senales-rapidas /home/m4rk/feed-v2/senales-rapidas.jsonl --traza /home/m4rk/feed-v2/traza.jsonl --politica if_senal --vigencia-segundos 60 --refresco-segundos 20 --seguir --control-d5 /home/m4rk/feed-v2/d5/control/control.json --d5-origen 10.10.20.30 --d5-auditoria /home/m4rk/feed-v2/d5/auditoria/d5-auditoria.jsonl --lista-blanca /home/m4rk/cyberflow/configs/lista-blanca.json
